name: Publish workshop slides

on:
  push:
    branches: [main]
    paths:
      - "slides/**"
      - "app-*/**"
      - "R/**"
      - ".github/workflows/slides-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Las slides usan las dependencias del runner, no el perfil renv de las apps.
      R_PROFILE_USER: /dev/null
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install render dependencies
        shell: Rscript {0}
        run: |
          packages <- c("rmarkdown", "shinylive", "shiny", "bslib", "forecast")
          install.packages(packages, repos = Sys.getenv("RSPM", "https://cloud.r-project.org"))
          stopifnot(all(vapply(packages, requireNamespace, logical(1), quietly = TRUE)))

      - name: Render presentation
        run: quarto render slides/index.qmd

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload presentation
        uses: actions/upload-pages-artifact@v5
        with:
          path: slides

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
