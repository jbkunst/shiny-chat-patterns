    <text x="445" y="480" font-size="21" fill="#174a70"
      font-family="inherit">filas</text>
    <text x="1050" y="370" font-size="21" fill="#174a70"
      font-family="inherit">SELECT</text>
    <text x="1050" y="480" font-size="21" fill="#174a70"
      font-family="inherit">filas</text>
    <text x="750" y="325" font-size="20" fill="#174a70"
