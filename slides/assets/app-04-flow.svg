<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 540" role="img"
  aria-labelledby="app-04-flow-title app-04-flow-desc">
  <title id="app-04-flow-title">SQL sobre la tabla completa y dashboard con filtro manual</title>
  <desc id="app-04-flow-desc">
    En gris se conserva el filtro que actualiza data y los outputs. En azul, consultar_tabla valida un
    SELECT y consulta la tabla completa paises en DuckDB. El agente recibe las filas para responder;
    esta tool no cambia el filtro ni los datos reactivos del dashboard.
  </desc>
  <defs>
    <marker id="app-04-flow-old" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="8" markerHeight="8" orient="auto-start-reverse">
