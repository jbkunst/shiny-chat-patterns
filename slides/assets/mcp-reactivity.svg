  <rect x="1150" y="35" width="230" height="85" rx="16"
    fill="#fffefa" stroke="#ced9dc" stroke-width="2"/>
  <rect x="1150" y="155" width="230" height="85" rx="16"
    fill="#fffefa" stroke="#ced9dc" stroke-width="2"/>
  <rect x="1150" y="275" width="230" height="85" rx="16"
    fill="#fffefa" stroke="#ced9dc" stroke-width="2"/>
  <rect x="1150" y="395" width="230" height="85" rx="16"
    fill="#fffefa" stroke="#ced9dc" stroke-width="2"/>
  <g font-family="inherit" text-anchor="middle">
    <text x="155.0" y="82.0" font-size="25" fill="#174a70"
      font-family="inherit">Servidor MCP</text>
    <text x="155.0" y="114.0" font-size="25" fill="#174a70"
      font-family="inherit">Datos del FMI</text>
    <text x="155.0" y="413.0" font-size="25" fill="#5f6d72"
      font-family="inherit">Agente</text>
    <text x="580" y="375" font-size="26" fill="#174a70"
      font-family="IBM Plex Mono, monospace">guardar_datos</text>
    <text x="580" y="408" font-size="20" fill="#5f6d72"
      font-family="IBM Plex Mono, monospace">(datos, variables)</text>
    <text x="580" y="447" font-size="20" fill="#5f6d72"
      font-family="inherit">filas: pais, anio, x, y</text>
    <text x="960.0" y="397.0" font-size="32" fill="#5f6d72"
      font-family="IBM Plex Mono, monospace">data()</text>
    <text x="960.0" y="429.0" font-size="21" fill="#5f6d72"
