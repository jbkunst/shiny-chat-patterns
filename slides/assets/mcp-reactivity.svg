    <text x="1265.0" y="85.5" font-size="25" fill="#5f6d72"
      font-family="inherit">Indicadores</text>
    <text x="1265.0" y="205.5" font-size="25" fill="#5f6d72"
      font-family="inherit">Mapa (y)</text>
    <text x="1265.0" y="325.5" font-size="25" fill="#5f6d72"
      font-family="inherit">Gráfico (x, y)</text>
    <text x="1265.0" y="445.5" font-size="25" fill="#5f6d72"
      font-family="inherit">Tabla (x, y)</text>
    <text x="45" y="260" font-size="21" fill="#174a70"
      font-family="inherit">consulta</text>
    <text x="260" y="260" font-size="21" fill="#174a70"
      font-family="inherit">datos</text>
    <text x="345" y="370" font-size="21" fill="#174a70"
      font-family="inherit">llama</text>
    <text x="685" y="260" font-size="20" fill="#174a70"
      font-family="inherit">Y SE COMPARTE ENTRE EL MAPA Y EL GRÁFICO</text>
  </g>
</svg>
