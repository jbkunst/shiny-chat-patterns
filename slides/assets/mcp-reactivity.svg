<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 540" role="img"
  aria-labelledby="mcp-reactivity-title mcp-reactivity-desc">
  <title id="mcp-reactivity-title">El MCP actualiza X e Y para toda la vista</title>
  <desc id="mcp-reactivity-desc">
    El agente consulta el MCP del FMI y llama a guardar_datos(datos, variables). Las filas tienen pais,
    anio, x e y; variables conserva nombres, indicadores y unidades. La tool reemplaza data. El mapa usa
    y; el gráfico usa x e y; la tabla muestra pais, anio, x e y. La infraestructura reactiva conocida
    aparece en gris y la nueva ruta MCP en azul.
  </desc>
  <defs>
    <marker id="mcp-reactivity-old" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#8c9aa0" stroke-width="1.6"/>
    </marker>
    <marker id="mcp-reactivity-new" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#174a70" stroke-width="1.6"/>
    </marker>
  </defs>
  <path d="M 1070 405 H 1110 V 77 H 1138" fill="none" stroke="#8c9aa0" stroke-width="2.5"
