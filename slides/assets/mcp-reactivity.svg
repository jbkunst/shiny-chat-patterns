  <rect x="20" y="350" width="270" height="110" rx="16"
    fill="#fffefa" stroke="#ced9dc" stroke-width="2"/>
  <rect x="400" y="330" width="360" height="150" rx="16"
    fill="#e5edf1" stroke="#174a70" stroke-width="2"/>
  <rect x="850" y="350" width="220" height="110" rx="16"
