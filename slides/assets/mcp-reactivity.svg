    marker-end="url(#mcp-reactivity-new)"/>
  <path d="M 210 145 V 338" fill="none" stroke="#174a70" stroke-width="2.5"
    stroke-linecap="round" stroke-linejoin="round"
    marker-end="url(#mcp-reactivity-new)"/>
  <path d="M 290 390 H 388" fill="none" stroke="#174a70" stroke-width="2.5"
    stroke-linecap="round" stroke-linejoin="round"
    marker-end="url(#mcp-reactivity-new)"/>
  <path d="M 400 435 H 302" fill="none" stroke="#174a70" stroke-width="2.5"
