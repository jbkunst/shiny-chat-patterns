    <text x="535.0" y="62.0" font-size="23" fill="#5f6d72"
      font-family="IBM Plex Mono, monospace">consultar_tabla(consulta)</text>
    <text x="535.0" y="94.0" font-size="25" fill="#5f6d72"
      font-family="inherit">Devuelve filas al chat</text>
    <text x="1250.0" y="62.0" font-size="25" fill="#5f6d72"
      font-family="inherit">DuckDB</text>
    <text x="1250.0" y="94.0" font-size="25" fill="#5f6d72"
      font-family="inherit">Tabla paises</text>
    <text x="535.0" y="217.0" font-size="23" fill="#5f6d72"
      font-family="IBM Plex Mono, monospace">actualizar_dashboard()</text>
    <text x="535.0" y="249.0" font-size="25" fill="#5f6d72"
      font-family="inherit">Actualiza el SQL</text>
    <text x="905.0" y="233.0" font-size="21" fill="#5f6d72"
      font-family="IBM Plex Mono, monospace">consulta_actual()</text>
    <text x="905.0" y="372.0" font-size="30" fill="#5f6d72"
