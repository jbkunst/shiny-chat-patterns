    <text x="535" y="463" font-size="24" fill="#174a70"
      font-family="IBM Plex Mono, monospace">mostrar_grafico</text>
    <text x="535" y="492" font-size="20" fill="#5f6d72"
      font-family="IBM Plex Mono, monospace">(x, y, color, titulo)</text>
    <text x="925" y="40" font-size="21" fill="#5f6d72"
      font-family="inherit">SELECT</text>
    <text x="925" y="140" font-size="21" fill="#5f6d72"
      font-family="inherit">filas</text>
    <text x="270" y="395" font-size="21" fill="#174a70"
      font-family="inherit">llama</text>
    <text x="220" y="505" font-size="21" fill="#174a70"
      font-family="inherit">confirmación</text>
    <text x="905" y="465" font-size="20" fill="#174a70"
      font-family="IBM Plex Mono, monospace">isolate(data())</text>
    <text x="1040" y="465" font-size="21" fill="#174a70"
      font-family="inherit">abre</text>
    <text x="535" y="532" font-size="19" fill="#5f6d72"
