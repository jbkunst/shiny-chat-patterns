    <text x="905.0" y="404.0" font-size="25" fill="#5f6d72"
      font-family="inherit">Países visibles</text>
    <text x="1250.0" y="217.0" font-size="25" fill="#5f6d72"
      font-family="inherit">Indicadores</text>
    <text x="1250.0" y="249.0" font-size="25" fill="#5f6d72"
