<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 540" role="img"
  aria-labelledby="app-06-flow-title app-06-flow-desc">
  <title id="app-06-flow-title">Consultar, actualizar y mostrar son acciones distintas</title>
  <desc id="app-06-flow-desc">
    En gris se conservan consultar_tabla, DuckDB y la ruta actualizar_dashboard, consulta_actual, data y
    outputs. consultar_tabla devuelve filas al agente sin cambiar el dashboard. En azul se agregan
    mostrar_tabla y mostrar_grafico, que leen los datos visibles y abren modales. El agente elige n y
    titulo para la tabla, o x, y, color y titulo para el gráfico. Los argumentos se muestran en gris
    tenue; las tools devuelven solo una confirmación al agente.
  </desc>
