<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 540" role="img"
  aria-labelledby="app-05-flow-title app-05-flow-desc">
  <title id="app-05-flow-title">La nueva tool cambia la consulta reactiva</title>
  <desc id="app-05-flow-desc">
    El agente conserva consultar_tabla y DuckDB para leer datos. La nueva tool actualizar_dashboard
    valida y ejecuta el SQL, guarda consulta_actual y devuelve una confirmación. Cambiar consulta_actual
    invalida data y actualiza indicadores, gráfico y tabla. Los componentes conocidos aparecen en gris y
    la nueva ruta de actualización en azul.
  </desc>
  <defs>
    <marker id="app-05-flow-old" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#8c9aa0" stroke-width="1.6"/>
    </marker>
    <marker id="app-05-flow-new" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#174a70" stroke-width="1.6"/>
    </marker>
  </defs>
  <path d="M 360 85 H 282" fill="none" stroke="#8c9aa0" stroke-width="2.5"
    stroke-linecap="round" stroke-linejoin="round"
    marker-end="url(#app-05-flow-old)"/>
  <path d="M 270 130 H 348" fill="none" stroke="#8c9aa0" stroke-width="2.5"
    stroke-linecap="round" stroke-linejoin="round"
    marker-end="url(#app-05-flow-old)"/>
  <path d="M 145 350 V 245 H 535 V 172" fill="none" stroke="#8c9aa0" stroke-width="2.5"
    stroke-linecap="round" stroke-linejoin="round"
    marker-end="url(#app-05-flow-old)"/>
  <path d="M 270 390 H 348" fill="none" stroke="#174a70" stroke-width="2.5"
    stroke-linecap="round" stroke-linejoin="round"
    marker-end="url(#app-05-flow-new)"/>
  <path d="M 710 405 H 778" fill="none" stroke="#174a70" stroke-width="2.5"
    stroke-linecap="round" stroke-linejoin="round"
    marker-end="url(#app-05-flow-new)"/>
  <path d="M 930 350 V 172" fill="none" stroke="#174a70" stroke-width="2.5"
    stroke-linecap="round" stroke-linejoin="round"
    marker-end="url(#app-05-flow-new)"/>
  <path d="M 1070 105 H 1138" fill="none" stroke="#174a70" stroke-width="2.5"
    stroke-linecap="round" stroke-linejoin="round"
    marker-end="url(#app-05-flow-new)"/>
  <path d="M 535 475 V 515 H 145 V 472" fill="none" stroke="#174a70" stroke-width="2.5"
    stroke-linecap="round" stroke-linejoin="round"
    marker-end="url(#app-05-flow-new)"/>
  <rect x="20" y="50" width="250" height="110" rx="16"
    fill="#fffefa" stroke="#ced9dc" stroke-width="2"/>
  <rect x="360" y="50" width="350" height="110" rx="16"
    fill="#fffefa" stroke="#ced9dc" stroke-width="2"/>
  <rect x="20" y="350" width="250" height="110" rx="16"
    fill="#fffefa" stroke="#ced9dc" stroke-width="2"/>
  <rect x="360" y="335" width="350" height="140" rx="16"
    fill="#e5edf1" stroke="#174a70" stroke-width="2"/>
  <rect x="790" y="350" width="280" height="110" rx="16"
    fill="#e5edf1" stroke="#174a70" stroke-width="2"/>
  <rect x="790" y="50" width="280" height="110" rx="16"
    fill="#fffefa" stroke="#ced9dc" stroke-width="2"/>
  <rect x="1150" y="50" width="230" height="140" rx="16"
    fill="#fffefa" stroke="#ced9dc" stroke-width="2"/>
  <g font-family="inherit" text-anchor="middle">
    <text x="145.0" y="97.0" font-size="25" fill="#5f6d72"
      font-family="inherit">DuckDB</text>
    <text x="145.0" y="129.0" font-size="25" fill="#5f6d72"
      font-family="inherit">Tabla paises</text>
    <text x="535.0" y="97.0" font-size="24" fill="#5f6d72"
      font-family="IBM Plex Mono, monospace">consultar_tabla()</text>
    <text x="535.0" y="129.0" font-size="25" fill="#5f6d72"
      font-family="inherit">Lectura SQL</text>
    <text x="145.0" y="413.0" font-size="25" fill="#5f6d72"
      font-family="inherit">Agente</text>
    <text x="535.0" y="397.0" font-size="23" fill="#174a70"
      font-family="IBM Plex Mono, monospace">actualizar_dashboard()</text>
    <text x="535.0" y="429.0" font-size="25" fill="#174a70"
      font-family="inherit">Valida y ejecuta SQL</text>
    <text x="930.0" y="397.0" font-size="23" fill="#174a70"
      font-family="IBM Plex Mono, monospace">consulta_actual()</text>
    <text x="930.0" y="429.0" font-size="25" fill="#174a70"
      font-family="inherit">Guarda el SQL</text>
    <text x="930.0" y="97.0" font-size="30" fill="#5f6d72"
      font-family="IBM Plex Mono, monospace">data()</text>
    <text x="930.0" y="129.0" font-size="23" fill="#5f6d72"
      font-family="IBM Plex Mono, monospace">dbGetQuery()</text>
    <text x="1265.0" y="112.0" font-size="25" fill="#5f6d72"
      font-family="inherit">Indicadores</text>
    <text x="1265.0" y="144.0" font-size="25" fill="#5f6d72"
      font-family="inherit">Gráfico y tabla</text>
    <text x="315" y="65" font-size="21" fill="#5f6d72"
      font-family="inherit">SELECT</text>
    <text x="315" y="175" font-size="21" fill="#5f6d72"
      font-family="inherit">filas</text>
    <text x="350" y="228" font-size="21" fill="#5f6d72"
      font-family="inherit">consulta</text>
    <text x="1000" y="270" font-size="21" fill="#174a70"
      font-family="inherit">invalida</text>
    <text x="345" y="505" font-size="21" fill="#174a70"
      font-family="inherit">confirmación y filas</text>
    <text x="535" y="310" font-size="20" fill="#174a70"
      font-family="inherit">NUEVO: CAMBIAR EL ESTADO</text>
  </g>
</svg>
