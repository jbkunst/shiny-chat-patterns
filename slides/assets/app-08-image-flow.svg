<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 540" role="img"
  aria-labelledby="app-08-image-flow-title app-08-image-flow-desc">
  <title id="app-08-image-flow-title">El gráfico del modal también llega al agente como imagen</title>
  <desc id="app-08-image-flow-desc">
    En gris se conserva consulta_actual, data, los outputs y el modal que ya abría mostrar_grafico. La
    función dibujar produce el gráfico del modal y ahora también un PNG. La nueva ruta azul devuelve esa
    imagen y una confirmación al agente para interpretarla. El agente lee los mismos datos visibles; no
    se crea un dataset separado. El agente elige x, y, color y titulo, mostrados en gris tenue.
  </desc>
