<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 540" role="img"
  aria-labelledby="app-00-flow-title app-00-flow-desc">
  <title id="app-00-flow-title">Tres inputs con dependencias compartidas entre dos outputs</title>
  <desc id="app-00-flow-desc">
    input$title y input$n alimentan renderText y el título del gráfico. input$n y input$forecast
    alimentan renderPlot y el gráfico. Los tres inputs aparecen una sola vez, con input$n al medio y
    conectado a ambos renderizadores.
  </desc>
  <defs>
    <marker id="app-00-flow-old" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#8c9aa0" stroke-width="1.6"/>
    </marker>
    <marker id="app-00-flow-new" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#174a70" stroke-width="1.6"/>
    </marker>
  </defs>
  <path d="M 380 100 L 538 170" fill="none" stroke="#174a70" stroke-width="2.5"
    stroke-linecap="round" stroke-linejoin="round"
    marker-end="url(#app-00-flow-new)"/>
  <path d="M 380 250 L 538 200" fill="none" stroke="#174a70" stroke-width="2.5"
    stroke-linecap="round" stroke-linejoin="round"
    marker-end="url(#app-00-flow-new)"/>
  <path d="M 380 290 L 538 340" fill="none" stroke="#174a70" stroke-width="2.5"
    stroke-linecap="round" stroke-linejoin="round"
    marker-end="url(#app-00-flow-new)"/>
  <path d="M 380 440 L 538 375" fill="none" stroke="#174a70" stroke-width="2.5"
    stroke-linecap="round" stroke-linejoin="round"
    marker-end="url(#app-00-flow-new)"/>
  <path d="M 860 185 H 1028" fill="none" stroke="#174a70" stroke-width="2.5"
    stroke-linecap="round" stroke-linejoin="round"
    marker-end="url(#app-00-flow-new)"/>
  <path d="M 860 355 H 1028" fill="none" stroke="#174a70" stroke-width="2.5"
    stroke-linecap="round" stroke-linejoin="round"
    marker-end="url(#app-00-flow-new)"/>
  <rect x="20" y="50" width="360" height="100" rx="16"
    fill="#fffefa" stroke="#ced9dc" stroke-width="2"/>
  <rect x="20" y="220" width="360" height="100" rx="16"
    fill="#fffefa" stroke="#ced9dc" stroke-width="2"/>
  <rect x="20" y="390" width="360" height="100" rx="16"
    fill="#fffefa" stroke="#ced9dc" stroke-width="2"/>
  <rect x="550" y="135" width="310" height="100" rx="16"
    fill="#e5edf1" stroke="#174a70" stroke-width="2"/>
  <rect x="550" y="305" width="310" height="100" rx="16"
    fill="#e5edf1" stroke="#174a70" stroke-width="2"/>
  <rect x="1040" y="135" width="340" height="100" rx="16"
    fill="#fffefa" stroke="#ced9dc" stroke-width="2"/>
  <rect x="1040" y="305" width="340" height="100" rx="16"
    fill="#fffefa" stroke="#ced9dc" stroke-width="2"/>
  <g font-family="inherit" text-anchor="middle">
    <text x="200.0" y="92.0" font-size="25" fill="#5f6d72"
      font-family="inherit">Título</text>
    <text x="200.0" y="124.0" font-size="25" fill="#5f6d72"
      font-family="IBM Plex Mono, monospace">input$title</text>
    <text x="200.0" y="262.0" font-size="25" fill="#5f6d72"
      font-family="inherit">Cantidad de puntos</text>
    <text x="200.0" y="294.0" font-size="25" fill="#5f6d72"
      font-family="IBM Plex Mono, monospace">input$n</text>
    <text x="200.0" y="432.0" font-size="25" fill="#5f6d72"
      font-family="inherit">Mostrar pronóstico</text>
    <text x="200.0" y="464.0" font-size="25" fill="#5f6d72"
      font-family="IBM Plex Mono, monospace">input$forecast</text>
    <text x="705.0" y="193.0" font-size="28" fill="#174a70"
      font-family="IBM Plex Mono, monospace">renderText()</text>
    <text x="705.0" y="363.0" font-size="28" fill="#174a70"
      font-family="IBM Plex Mono, monospace">renderPlot()</text>
    <text x="1210.0" y="177.0" font-size="25" fill="#5f6d72"
      font-family="inherit">Título del gráfico</text>
    <text x="1210.0" y="209.0" font-size="24" fill="#5f6d72"
      font-family="IBM Plex Mono, monospace">output$plot_title</text>
    <text x="1210.0" y="347.0" font-size="25" fill="#5f6d72"
      font-family="inherit">Gráfico de pasajeros</text>
    <text x="1210.0" y="379.0" font-size="24" fill="#5f6d72"
      font-family="IBM Plex Mono, monospace">output$plot</text>
    <text x="200" y="25" font-size="20" fill="#5f6d72"
      font-family="inherit">INPUTS</text>
    <text x="705" y="25" font-size="20" fill="#174a70"
      font-family="inherit">SERVER</text>
    <text x="1210" y="25" font-size="20" fill="#5f6d72"
      font-family="inherit">OUTPUTS</text>
  </g>
</svg>
