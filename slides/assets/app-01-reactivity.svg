<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 540" role="img"
  aria-labelledby="app-01-reactivity-title app-01-reactivity-desc">
  <title id="app-01-reactivity-title">Datos reactivos compartidos por los outputs</title>
  <desc id="app-01-reactivity-desc">
    El filtro de continente cambia data. Los indicadores, el gráfico y la tabla dependen de esos mismos
    datos. El patrón de inputs y outputs se conserva en gris; la expresión reactiva y sus dependencias
    nuevas se destacan en azul.
  </desc>
